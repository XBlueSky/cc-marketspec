# Source-only workflow. Artifacts are for same-pipeline transfer or inspection,
# not a stable public endpoint. Deploy external consumer output with the site to
# Pages, a CDN, or object storage.
stages: [validate, build]

validate-marketplace:
  stage: validate
  image: node:22
  script:
    - npx @xbluesky/cc-marketspec --check

generate-marketplace:
  stage: build
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npx @xbluesky/cc-marketspec
  artifacts:
    paths:
      - .cc-marketspec/dist/manifest.json
